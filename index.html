>kg</option><option>L</option><option>pièce</option></select></label><button onclick="addArticle()">Enregistrer</button><hr>'+db.articles.map(a=>`<p>${esc(a.name)} — ${esc(a.unit)} · ${esc(a.cat)}</p>`).join(''))}function addArticle(){let name=$('name').value.trim(),pack=1;if(!name)return alert('Données invalides');db.articles.push({id:uid(),name,cat:$('cat').value,unit:$('unit').value,pack});save();articles()}function suppliers(){show('Fournisseurs','<label>Nom<input id="name"></label><label>Téléphone<input id="tel" type="tel"></label><button onclick="addSupplier()">Enregistrer</button><hr>'+db.suppliers.map(s=>`<p>${esc(s.name)} · ${esc(s.tel)}</p>`).join(''))}function addSupplier(){let name=$('name').value.trim();if(!name)return;db.suppliers.push({id:uid(),name,tel:$('tel').value});save();suppliers()}function invoice(id){edit=id?db.invoices.find(i=>i.id===id):null;draft=edit?structuredClone(edit.lines):[];photo=edit?.photo||'';show('Facture',`<button onclick="ocrPage()">Scanner une facture (OCR)</button><label>Numéro<input id="num" value="${esc(edit?.num||nextNum())}"></label><label>Date<input id="date" type="date" value="${edit?.date||new Date().toISOString().slice(0,10)}"></label><label>Fournisseur<select id="supplier" onchange="suggestPrice()"><option value="" ${edit?'':'selected'}>Sélectionner un fournisseur</option>${opts(db.suppliers,edit?.supplier)}</select></label><button onclick="inlineCreate('suppliers')">+ Fournisseur</button><hr><label>Article<select id="article" onchange="suggestPrice()" oninput="suggestPrice()"><option value="" selected>Sélectionner un article</option>${opts(db.articles)}</select></label><button onclick="inlineCreate('articles')">+ Article</button> <button onclick="scanCode('article')">Scanner</button><label>Quantité (unité de mesure)<input id="qty" type="number" step="any"></label><label>Prix unitaire TTC (DH)<input id="ht" type="number" step="any"></label><small id="priceHint" aria-live="polite"></small><button onclick="addLine()" function storeInvoice(){let num=$('num').value.trim(),date=$('date').value,supplier=$('supplier').value;if(!num||!date||!supplier||!draft.length)return alert('Numéro, date, fournisseur et lignes obligatoires');if(db.invoices.some(i=>i.id!==edit?.id&&i.num===num&&i.supplier===supplier))return alert('Facture déjà présente');let i={id:edit?.id||uid(),num,date,supplier,lines:draft,photo};let old=db.invoices;db.invoices=old.filter(x=>x.id!==i.id).concat(i);if(save())home();else db.invoices=old}function an(id){return db.articles.find(a=>a.id===id)?.name||'?'}function sn(id){return db.suppliers.find(a=>a.id===id)?.name||'?'}function historyPage(){show('Historique',db.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="panel history-entry"><div><b>${esc(i.num)} · ${esc(sn(i.supplier))}</b><p>${i.date} · ${money(total(i))}</p></div><details><summary aria-label="Actions">⋮</summary><button onclick="invoice('${i.id}')">Modifier</button> <button onclick="removeInvoice('${i.id}')">Supprimer</button>${i.photo?` <button onclick="viewPhoto('${i.id}')">Photo</button>`:''}</details></div>`).join('')||'Aucune facture')}function viewPhoto(id){show('Photo','<img src="'+esc(db.invoices.find(i=>i.id===id).photo)+'">')}function removeInvoice(id){if(confirm('Supprimer cette facture ?')){db.invoices=db.invoices.filter(i=>i.id!==id);save();historyPage()}}function rows(){return db.invoices.flatMap(i=>i.lines.map(l=>({...l,date:i.date,supplier:i.supplier,num:i.num}))).sort((a,b)=>a.date.localeCompare(b.date))}function compare(){show('Comparaison des prix','<label>Article<select id="pick" onchange="comparison()">'+opts(db.articles)+'</select></label><div id="result"></div><div class="panel"><h3>Économie selon la quantité achetée</h3><label>Quantité à acheter<input id="compareQty" type="number" min="0" step="any" value="1" oninput="quantityComparison()"></label><div id="quantityResult"></div></div>');comparison()}

function comparison(){let a=comparisonData($('pick').value),max=a.length?a[a.length-1].p:0;$('result').innerHTML=a.length?'<small>Dernier achat connu par fournisseur (pas un devis actuel). Prix par unité de mesure.</small>'+a.map((r,i)=>`<p>${r.p===a[0].p?'★ ':''}${esc(sn(r.supplier))} — <b>${money(r.p)}</b> · ${esc(r.date)} — Économie : ${money(max-r.p)} (${max?((max-r.p)/max*100).toFixed(2):'0.00'} %)</p>`).join('')+'<small>Référence : prix le plus élevé parmi les derniers achats comparables.</small>':'Aucun achat';quantityComparison()}

function ocrPage(){let d=document.createElement('dialog');d.innerHTML='<h2>Scanner une facture</h2><p>La première utilisation nécessite Internet pour charger le moteur OCR. L’image est traitée sur cet appareil. Vérifiez toutes les valeurs.</p><input type="file" accept="image/*" capture="environment"><button data-run>Reconnaître le texte</button><p data-status></p><textarea placeholder="Texte reconnu ou saisi manuellement"></textarea><button data-parse>Préparer les lignes</button><div data-review></div><button data-close>Fermer</button>';document.body.append(d);d.showModal();d.onclose=()=>d.remove();d.querySelector('[data-close]').onclick=()=>d.close();let t=d.querySelector('textarea'),status=d.querySelector('[data-status]');d.querySelector('[data-run]').onclick=async()=>{let f=d.querySelector('input').files[0];if(!f)return alert('Choisissez une photo');let worker;try{status.textContent='Chargement du moteur OCR…';if(!window.Tesseract)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});worker=await Tesseract.createWorker('fra+eng',1,{logger:m=>{status.textContent=m.status+' '+Math.round((m.progress||0)*100)+' %'}});let r=await worker.recognize(f);t.value=r.data.text;status.textContent='Texte reconnu : vérifiez et préparez les lignes.'}catch(e){status.textContent='OCR indisponible. Vous pouvez saisir ou coller le texte manuellement.'}finally{if(worker)await worker.terminate()}};d.querySelector('[data-parse]').onclick=()=>ocrReview(d,t.value)}
function ocrReview(d,text){let norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),lines=text.split(/\n/),supplier=db.suppliers.find(s=>norm(text).includes(norm(s.name))),date=text.match(/\b(\d{2})[\/.-](\d{2})[\/.-](\d{4})\b/),num=text.match(/(?:facture|invoice)\s*(?:n[°o.]?\s*)?[:#-]?\s*([A-Z0-9][A-Z0-9/-]*\d[A-Z0-9/-]*)/i);let r=d.querySelector('[data-review]');r.innerHTML='<h3>Vérification</h3><label>Fournisseur<select data-s><option value="">Conserver la sélection actuelle</option>'+opts(db.suppliers,supplier?.id)+'</select></label><label>Date<input data-d type="date" value="'+(date?date[3]+'-'+date[2]+'-'+date[1]:'')+'"></label><label>Numéro<input data-n value="'+esc(num?.[1]||'')+'"></label><p>Seules les lignes reconnues avec un article existant sont proposées. Corrigez quantité et prix TTC. Les autres lignes restent à saisir manuellement.</p><div data-lines></div><button data-add>Ajouter les lignes vérifiées</button>';let box=r.querySelector('[data-lines]');for(let line of lines){let a=[...db.articles].sort((a,b)=>b.name.length-a.name.length).find(a=>norm(line).includes(norm(a.name)));if(!a)continue;let tail=norm(line).split(norm(a.name)).pop(),nums=tail.match(/\d+(?:[,.]\d+)?/g)||[];let row=document.createElement('div');row.className='panel';row.innerHTML='<small>'+esc(line)+'</small><label>Article<select>'+opts(db.articles,a.id)+'</select></label><label>Quantité<input type="number" step="any" value="'+(nums[0]||'').replace(',','.')+'"></label><label>Prix unitaire TTC<input type="number" step="any" value="'+(nums[1]||'').replace(',','.')+'"></label><label><input type="checkbox" style="width:auto"> Ligne vérifiée</label>';box.append(row)}r.querySelector('[data-add]').onclick=()=>{let additions=[];for(let row of box.children){let [q,p,c]=row.querySelectorAll('input');if(!c.checked)continue;let a=db.articles.find(a=>String(a.id)===row.querySelector('select').value);if(!a||!q.value||!p.value||!(+q.value>0)||!(+p.value>=0))return alert('Vérifiez les valeurs');additions.push({article:a.id,qty:+q.value,ht:+p.value,tax:0,pack:1})}if(r.querySelector('[data-s]').value)$('supplier').value=r.querySelector('[data-s]').value;if(r.querySelector('[data-d]').value)$('date').value=r.querySelector('[data-d]').value;if(r.querySelector('[data-n]').value)$('num').value=r.querySelector('[data-n]').value;draft.push(...additions);renderLines();d.close()}}

function orders(){return db.orders||[]}
function orderBest(article,date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;let [y,m,d]=date.split('-').map(Number),start=new Date(Date.UTC(y,m-4,1));start.setUTCDate(Math.min(d,new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate()));let from=start.toISOString().slice(0,10);return rows().filter(r=>String(r.article)===String(article)&&r.date>=from&&r.date<=date&&Number.isFinite(ttc(r))&&ttc(r)>=0).sort((a,b)=>ttc(a)-ttc(b)||b.date.localeCompare(a.date)||String(a.supplier).localeCompare(String(b.supplier)))[0]||null}
let od=[],oe=null,ol=-1,oref=null;
function orderNum(){let p='CMD'+new Date().getFullYear(),n=0;for(let o of orders())if(o.num.startsWith(p)&&/^\d+$/.test(o.num.slice(p.length)))n=Math.max(n,+o.num.slice(p.length));return p+String(n+1).padStart(4,'0')}
function orderPage(id,duplicate=false){let o=orders().find(x=>x.id===id);oe=duplicate?null:o||null;od=structuredClone(o?.lines||[]);ol=-1;oref=null;show('Nouvelle commande',`<label>Numéro<input id="onum" value="${esc(oe?.num||orderNum())}"></label><label>Date<input id="odate" type="date" value="${esc(oe?.date||new Date().toISOString().slice(0,10))}" onchange="orderSuggest()"></label><label>Article<select id="oarticle" onchange="orderSuggest()"><option value="">Sélectionner</option>${opts(db.articles)}</select></label><button onclick="scanCode('oarticle')">Scanner le code-barres</button><label>Fournisseur<select id="osupplier"><option value="">À déterminer</option>${opts(db.suppliers)}</select></label><label>Quantité<input id="oqty" type="number" min="0" step="any" oninput="orderLineTotal()"></label><label>Prix unitaire TTC (DH)<input id="oprice" type="number" min="0" step="any" oninput="orderLineTotal()"></label><small id="ohint"></small><p id="oltotal"></p><button id="oadd" onclick="orderAdd()">Ajouter la ligne</button><button onclick="orderReset()">Annuler la ligne</button><div id="olines"></div><button onclick="orderSave()">Enregistrer la commande</button>`);orderRender()}
function orderSuggest(){let r=orderBest($('oarticle').value,$('odate').value);oref=r?{supplier:r.supplier,date:r.date,price:ttc(r)}:null;$('oprice').value=r?ttc(r):'';$('osupplier').value=r?r.supplier:'';$('ohint').textContent=r?'Meilleur prix historique : '+money(ttc(r))+' · '+sn(r.supplier)+' · '+r.date:'Aucun achat dans les trois derniers mois. Saisie manuelle.';orderLineTotal()}
function orderLineTotal(){$('oltotal').textContent='Total ligne : '+money((+$('oqty').value||0)*(+$('oprice').value||0))}
function orderReset(){ol=-1;oref=null;for(let k of ['oarticle','osupplier','oqty','oprice'])$(k).value='';$('ohint').textContent='';$('oltotal').textContent='';$('oadd').textContent='Ajouter la ligne'}
function orderAdd(){let article=$('oarticle').value,supplier=$('osupplier').value,qty=+$('oqty').value,price=+$('oprice').value;if(!article||!$('oprice').value||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)return alert('Vérifiez article, quantité et prix.');let l={article,supplier,qty,price,reference:oref};if(ol<0)od.push(l);else od[ol]=l;orderReset();orderRender()}
function orderEditLine(i){let l=od[i];ol=i;oref=l.reference||null;$('oarticle').value=l.article;$('osupplier').value=l.supplier;$('oqty').value=l.qty;$('oprice').value=l.price;$('ohint').textContent=oref?'Référence : '+money(oref.price)+' · '+sn(oref.supplier)+' · '+oref.date:'';$('oadd').textContent='Valider la modification';orderLineTotal()}
function orderTotal(o){return o.lines.reduce((s,l)=>s+l.qty*l.price,0)}
function orderGroups(lines,editable=false){let g=new Map();lines.forEach((l,i)=>{let a=g.get(l.supplier)||[];a.push({l,i});g.set(l.supplier,a)});return [...g].map(([s,a])=>`<h3>${esc(s?sn(s):'Fournisseur à déterminer')}</h3>${a.map(({l,i})=>`<div class="entry"><div>${esc(an(l.article))}<br><small>${esc(l.qty)} × ${money(l.price)}</small></div><b>${money(l.qty*l.price)}</b>${editable?`<details><summary>⋮</summary><button onclick="orderEditLine(${i})">Modifier</button><button onclick="orderRemoveLine(${i})">Supprimer</button></details>`:''}</div>`).join('')}<p>Sous-total : <b>${money(a.reduce((v,x)=>v+x.l.qty*x.l.price,0))}</b></p>`).join('')+`<h3>Total TTC : ${money(orderTotal({lines}))}</h3>`}
function orderRemoveLine(i){if(confirm('Supprimer cette ligne ?')){od.splice(i,1);orderReset();orderRender()}}
function orderRender(){$('olines').innerHTML=orderGroups(od,true)}
function orderSave(){let num=$('onum').value.trim(),date=$('odate').value;if(!num||!date||!od.length)return alert('Numéro, date et lignes obligatoires.');if($('oarticle').value)return alert('Ajoutez ou annulez la ligne en cours.');if(orders().some(o=>o.id!==oe?.id&&o.num===num))return alert('Numéro déjà utilisé.');let old=db.orders;let o={id:oe?.id||uid(),num,date,lines:structuredClone(od)};db.orders=orders().filter(x=>x.id!==o.id).concat(o);if(save())orderHistory();else db.orders=old}
function orderHistory(){show('Historique des commandes','<input id="osearch" placeholder="Rechercher une commande" oninput="orderHistoryRender()"><button onclick="orderPage()">Nouvelle commande</button> <button onclick="orderExport()">Exporter Excel</button><div id="ohistory"></div>');orderHistoryRender()}
function orderHistoryRender(){let q=$('osearch').value.toLowerCase();$('ohistory').innerHTML=orders().slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(o=>[o.num,o.date,...o.lines.map(l=>sn(l.supplier)+' '+an(l.article))].join(' ').toLowerCase().includes(q)).map(o=>`<div class="panel history-entry"><div><b>${esc(o.num)}</b><p>${esc(o.date)} · ${money(orderTotal(o))}</p></div><details><summary>⋮</summary><button onclick="orderView('${o.id}')">Consulter</button><button onclick="orderPage('${o.id}')">Modifier</button><button onclick="orderPage('${o.id}',true)">Dupliquer</button><button onclick="orderPrint('${o.id}')">Imprimer</button><button onclick="orderDelete('${o.id}')">Supprimer</button></details></div>`).join('')||'Aucune commande'}
function orderView(id){let o=orders().find(x=>x.id===id);show('Commande '+esc(o.num),`<p>${esc(o.date)}</p><div id="orderPrintArea">${orderGroups(o.lines)}</div><button onclick="orderPrint('${id}')">Imprimer</button> <button onclick="orderHistory()">Historique</button>`)}
function orderPrint(id){orderView(id);window.print()}
function orderDelete(id){if(!confirm('Supprimer cette commande ?'))return;let old=db.orders;db.orders=orders().filter(o=>o.id!==id);if(save())orderHistory();else db.orders=old}
function orderExport(){exportX([['Commande','Date','Fournisseur','Article','Quantité','Prix TTC','Total TTC'],...orders().flatMap(o=>o.lines.map(l=>[o.num,o.date,l.supplier?sn(l.supplier):'',an(l.article),l.qty,l.price,l.qty*l.price]))],'commandes.xlsx','Commandes')}

home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>

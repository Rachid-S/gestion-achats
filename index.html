const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number(x).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' DH', uid=()=>crypto.randomUUID();let db=JSON.parse(localStorage.getItem('achats-v1')||'{"articles":[],"suppliers":[],"invoices":[]}'),draft=[],edit=null,photo='';function save(){try{localStorage.setItem('achats-v1',JSON.stringify(db));return true}catch(e){alert('Stockage plein : exportez une sauvegarde.');return false}}function show(t,h){$('app').innerHTML='<button onclick="home()">← Accueil</button><section><h2>'+t+'</h2>'+h+'</section>'}function home(){let m=new Date().toISOString().slice(0,7);$('app').innerHTML='<section><small>Achats du mois TTC</small><h2>'+money(db.invoices.filter(i=>i.date.startsWith(m)).reduce((s,i)=>s+total(i),0))+'</h2>'+db.invoices.length+' factures</section><div class="grid">'+[['Nouvelle facture','invoice()'],['Historique des factures','historyPage()'],['Nouvelle commande','orderPage()'],['Historique des commandes','orderHistory()'],['Articles','articles()'],['Catégories','catalogCat()'],['Unités de mesure','catalogUnit()'],['Fournisseurs','suppliers()'],['Comparaison des prix','compare()'],['Meilleurs prix par fournisseur','bestPage()'],['Meilleur prix par article','articleBestPage()'],['Évolution des prix','trend()'],['Importation Excel','imports()'],['Exportation Excel','exportX()'],['Sauvegarde / restauration','backup()']].map(([a,b])=>`<button onclick="${b}">${a}</button>`).join('')+'</div>'}function total(i){return i.lines.reduce((s,l)=>s+l.qty*l.ht*(1+l.tax/100),0)}function opts(a,v){return [...a].sort((x,y)=>String(x.name).localeCompare(String(y.name),'fr',{sensitivity:'base'})).map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('')}function articles(){show('Articles','<label>Désignation<input id="name"></label><label>Catégorie<input id="cat"></label><label>Unité de base<select id="unit"><option>kg</option><option>L</option><option>pièce</option></select></label><button onclick="addArticle()">Enregistrer</button><hr>'+db.articles.map(a=>`<p>${esc(a.name)} — ${esc(a.unit)} · ${esc(a.cat)}</p>`).join(''))}function addArticle(){let name=$('name').value.trim(),pack=1;if(!name)return alert('Données invalides');db.articles.push({id:uid(),name,cat:$('cat').value,unit:$('unit').value,pack});save();articles()}function suppliers(){show('Fournisseurs','<label>Nom<input id="name"></label><label>Téléphone<input id="tel" type="tel"></label><button onclick="addSupplier()">Enregistrer</button><hr>'+db.suppliers.map(s=>`<p>${esc(s.name)} · ${esc(s.tel)}</p>`).join(''))}function addSupplier(){let name=$('name').value.trim();if(!name)return;db.suppliers.push({id:uid(),name,tel:$('tel').value});save();suppliers()}function invoice(id){edit=id?db.invoices.find(i=>i.id===id):null;draft=edit?structuredClone(edit.lines):[];photo=edit?.photo||'';show('Facture',`<button onclick="ocrPage()">Scanner une facture (OCR)</button><label>Numéro<input id="num" value="${esc(edit?.num||nextNum())}"></label><label>Date<input id="date" type="date" value="${edit?.date||new Date().toISOString().slice(0,10)}"></label><label>Fournisseur<select id="supplier" onchange="suggestPrice()"><option value="" ${edit?'':'selected'}>Sélectionner un fournisseur</option>${opts(db.suppliers,edit?.supplier)}</select></label><button onclick="inlineCreate('suppliers')">+ Fournisseur</button><hr><label>Article<select id="article" onchange="suggestPrice()" oninput="suggestPrice()"><option value="" selected>Sélectionner un article</option>${opts(db.articles)}</select></label><button onclick="inlineCreate('articles')">+ Article</button> <button onclick="scanCode('article')">Scanner</button><label>Quantité (unité de mesure)<input id="qty" type="number" step="any"></label><label>Prix unitaire TTC (DH)<input id="ht" type="number" step="any"></label><small id="priceHint" aria-live="polite"></small><button onclick="addLine()">Ajouter la ligne</button><div id="lines"></div><label>Photo facultative<input type="file" accept="image/*" onchange="attach(this.files[0])"></label><small id="photoStatus">${photo?'Photo jointe':''}</small><p><button onclick="storeInvoice()">Enregistrer la facture</button></p>`);renderLines()}function attach(f){if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;$('photoStatus').textContent='Photo jointe'};if(f.size>1500000)return alert('Photo trop grande (max. 1,5 Mo).');r.readAsDataURL(f)}function lastPrice(article,supplier,date,excluded){let rows=[];db.invoices.forEach((f,fi)=>{if(f.id===excluded)return;f.lines.forEach((l,li)=>{if(String(l.article)===String(article)&&sameUnit(l)&&Number.isFinite(ttc(l)))rows.push({f,l,fi,li})})});rows.sort((a,b)=>b.f.date.localeCompare(a.f.date)||b.fi-a.fi||b.li-a.li);return rows.find(r=>String(r.f.supplier)===String(supplier))||rows[0]}
function suggestPrice(){let a=$('article').value,s=$('supplier').value,h=$('priceHint');$('ht').value='';h.textContent='';if(!a)return;let r=lastPrice(a,s,$('date').value,edit?.id);if(!r)return;let price=ttc(r.l);if(!Number.isFinite(price))return;$('ht').value=String(Math.round(price*1000000)/1000000);h.textContent='Dernier prix : '+sn(r.f.supplier)+' · '+r.f.date}
function addLine(){let qty=+$('qty').value,ht=+$('ht').value,tax=0;if(!$('article').value||!$('qty').value||!$('ht').value||!Number.isFinite(qty)||!Number.isFinite(ht)||qty<=0||ht<0||tax<0)return alert('Vérifiez les valeurs');let a=db.articles.find(a=>a.id===$('article').value);draft.push({article:a.id,unit:a.unit,qty,ht,tax,pack:1});$('article').value='';$('qty').value='';$('ht').value='';$('priceHint').textContent='';renderLines()}function renderLines(){$('lines').innerHTML=draft.map((l,i)=>`<div class="entry"><span><b>${esc(an(l.article))}</b><br><small>${esc(quantityUnit(l))} × ${money(ttc(l))}</small></span><b>${money(l.qty*ttc(l))}</b><details><summary aria-label="Actions">⋮</summary><div class="action-menu"><button onclick="editLine(${i})">Modifier</button> <button onclick="if(confirm('Supprimer la ligne ?')){draft.splice(${i},1);renderLines()}">Supprimer</button></div></details></div>`).join('')+'<p>Total TTC : <b>'+money(total({lines:draft}))+'</b></p>'}
function storeInvoice(){let num=$('num').value.trim(),date=$('date').value,supplier=$('supplier').value;if(!num||!date||!supplier||!draft.length)return alert('Numéro, date, fournisseur et lignes obligatoires');if(db.invoices.some(i=>i.id!==edit?.id&&i.num===num&&i.supplier===supplier))return alert('Facture déjà présente');let i={id:edit?.id||uid(),num,date,supplier,lines:draft.map(l=>({...l,unit:lineUnit(l)})),photo};let old=db.invoices;db.invoices=old.filter(x=>x.id!==i.id).concat(i);if(save())home();else db.invoices=old}function an(id){return db.articles.find(a=>a.id===id)?.name||'?'}function sn(id){return db.suppliers.find(a=>a.id===id)?.name||'?'}function historyPage(){show('Historique des factures',db.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="panel history-entry"><div><b>${esc(i.num)} · ${esc(sn(i.supplier))}</b><p>${i.date} · ${money(total(i))}</p></div><details><summary aria-label="Actions">⋮</summary><div class="action-menu"><button onclick="invoiceView('${i.id}')">Consulter</button><button onclick="invoice('${i.id}')">Modifier</button><button onclick="invoiceDuplicate('${i.id}')">Dupliquer</button><button onclick="invoicePrint('${i.id}')">Imprimer</button> <button onclick="removeInvoice('${i.id}')">Supprimer</button>${i.photo?` <button onclick="viewPhoto('${i.id}')">Photo</button>`:''}</div></details></div>`).join('')||'Aucune facture')}function viewPhoto(id){show('Photo','<img src="'+esc(db.invoices.find(i=>i.id===id).photo)+'">')}function removeInvoice(id){if(confirm('Supprimer cette facture ?')){db.invoices=db.invoices.filter(i=>i.id!==id);save();historyPage()}}function rows(){return db.invoices.flatMap(i=>i.lines.map(l=>({...l,date:i.date,supplier:i.supplier,num:i.num}))).sort((a,b)=>a.date.localeCompare(b.date))}function compare(){show('Comparaison des prix','<label>Article<select id="pick" onchange="comparison()">'+opts(db.articles)+'</select></label><div id="result"></div><div class="panel"><h3>Économie selon la quantité achetée</h3><label>Quantité à acheter <span id="compareUnit"></span><input id="compareQty" type="number" min="0" step="any" value="1" oninput="quantityComparison()"></label><div id="quantityResult"></div></div>');comparison()}
function comparisonData(article){let latest=new Map();for(let r of rows())if(String(r.article)===String(article)&&sameUnit(r)&&Number.isFinite(ttc(r))&&ttc(r)>=0)latest.set(String(r.supplier),r);return [...latest.values()].map(r=>({...r,p:ttc(r)})).sort((a,b)=>a.p-b.p)}
function comparison(){if($('compareUnit'))$('compareUnit').textContent=db.articles.find(a=>a.id===$('pick').value)?.unit||'';let a=comparisonData($('pick').value),max=a.length?a[a.length-1].p:0;$('result').innerHTML=a.length?'<small>Dernier achat connu par fournisseur (pas un devis actuel). Prix par unité de mesure.</small>'+a.map((r,i)=>`<p>${r.p===a[0].p?'★ ':''}${esc(sn(r.supplier))} — <b>${money(r.p)}</b> · ${esc(r.date)} — Économie : ${money(max-r.p)} (${max?((max-r.p)/max*100).toFixed(2):'0.00'} %)</p>`).join('')+'<small>Référence : prix le plus élevé parmi les derniers achats comparables.</small>':'Aucun achat';quantityComparison()}
function quantityComparison(){let a=comparisonData($('pick').value),q=Number($('compareQty').value),out=$('quantityResult');if(!a.length){out.textContent='Aucun achat';return}if(!$('compareQty').value||!Number.isFinite(q)||q<0){out.textContent='Saisissez une quantité positive ou nulle.';return}let max=a[a.length-1].p;out.innerHTML=a.map(r=>`<p>${esc(sn(r.supplier))} — <b>${money(q*r.p)}</b><br><small>Économie : ${money(q*(max-r.p))}</small></p>`).join('')+(a.length>1?`<hr><b>Économie totale réalisable : ${money(q*(max-a[0].p))} (${max?((max-a[0].p)/max*100).toFixed(2):'0.00'} %)</b>`:'<small>Aucun autre fournisseur comparable.</small>')}

function trendData(article,supplier){let groups=new Map();for(let r of rows()){if(String(r.article)!==String(article)||!sameUnit(r)||(supplier!=='__all__'&&String(r.supplier)!==String(supplier))||!Number.isFinite(ttc(r))||ttc(r)<0||!Number.isFinite(Date.parse(r.date)))continue;let k=String(r.supplier);if(!groups.has(k))groups.set(k,[]);groups.get(k).push({...r,p:ttc(r)})}return groups}
function plot(){let groups=trendData($('pick').value,$('sup').value),all=[...groups.values()].flat();if(!all.length){$('result').textContent='Aucun achat';return}let dates=[...new Set(all.map(r=>r.date))].sort(),lo=Date.parse(dates[0]),hi=Date.parse(dates[dates.length-1]),min=Math.min(...all.map(r=>r.p)),max=Math.max(...all.map(r=>r.p)),pad=Math.max((max-min)*.15,max*.03,.001);min=Math.max(0,min-pad);max+=pad;let x=r=>hi===lo?195:60+(Date.parse(r.date)-lo)/(hi-lo)*270,y=r=>155-(r.p-min)/(max-min)*125;let colors=['#16805c','#2864c7','#b45309','#9333a8','#be123c','#087e8b'];let svg='<svg viewBox="0 0 350 190" width="100%" role="img" aria-label="Évolution des prix TTC par fournisseur">';for(let i=0;i<=4;i++){let v=min+(max-min)*i/4,yy=y({p:v});svg+=`<line x1="60" x2="330" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".15"/><text x="55" y="${yy+3}" text-anchor="end" font-size="9" fill="currentColor">${esc(Number(v.toPrecision(5)).toLocaleString('fr-FR'))}</text>`}let legend='',details='',i=0;for(let [id,a] of groups){let c=colors[i]||`hsl(${i*137.508%360},65%,42%)`;i++;svg+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${a.map(r=>`${x(r)},${y(r)}`).join(' ')}"/>`+a.map(r=>`<circle cx="${x(r)}" cy="${y(r)}" r="3" fill="${c}"><title>${esc(sn(id))} · ${esc(r.date)} · ${money(r.p)}</title></circle>`).join('');legend+=`<span style="display:inline-block;margin:5px"><span style="color:${c}">●</span> ${esc(sn(id))}</span>`;details+=`<h3>${esc(sn(id))}</h3>`+a.map((r,j)=>`<p>${esc(r.date)} — ${money(r.p)} TTC / unité ${j&&a[j-1].p?((r.p/a[j-1].p-1)*100).toFixed(1)+' %':''}</p>`).join('')}svg+=`<text x="${hi===lo?195:60}" y="175" text-anchor="${hi===lo?'middle':'start'}" font-size="10" fill="currentColor">${esc(dates[0])}</text>`+(hi!==lo?`<text x="330" y="175" text-anchor="end" font-size="10" fill="currentColor">${esc(dates[dates.length-1])}</text>`:'')+'</svg>';$('result').innerHTML=svg+'<div>'+legend+'</div>'+details}

function bestData(supplier,months=preferredMonths(),date=localDay()){return articleBestData(months,date).flatMap(({a,w})=>{let r=w.find(r=>String(r.supplier)===String(supplier));if(!r)return [];let all=periodRows(a.id,date,months),mins=new Map();for(let x of all){let k=String(x.supplier);mins.set(k,Math.min(mins.get(k)??Infinity,ttc(x)))}return [{a,r,w,n:mins.size,p:ttc(r),max:Math.max(...mins.values())}]})}

function bestRender(){let c=bestCurrent();if(!c){$('bestResult').textContent='Période invalide.';return}let b=c.data.filter(x=>x.n>1),u=c.data.filter(x=>x.n===1);$('bestResult').innerHTML=`<p>${esc(sn(c.supplier))} · ${esc(c.m)} mois au ${esc(c.day)} · ${b.length} articles au meilleur prix (égalités incluses).</p>`+b.map(x=>`<div class="report-item"><b>${esc(x.a.name)} — ${money(x.p)} / ${esc(x.a.unit)}</b><p>Fournisseurs ex æquo : ${x.w.map(r=>esc(sn(r.supplier))).join(', ')}</p><small>Économie vs minimum fournisseur le plus élevé : ${money(x.max-x.p)} (${x.max?((x.max-x.p)/x.max*100).toFixed(2):0} %)</small></div>`).join('')+'<h3>Sans autre fournisseur comparable</h3>'+u.map(x=>`<p>${esc(x.a.name)} — ${money(x.p)} / ${esc(x.a.unit)}</p>`).join('')}
function bestConsult(){let c=bestCurrent();if(!c)return alert('Période invalide.');let body=c.data.map(x=>[x.a.name,x.a.unit,money(x.p),sn(c.supplier),x.r.date]);pricePreview('État des meilleurs prix par fournisseur',c.m,c.day,body,bestExport,'Fournisseur : '+sn(c.supplier))}
function bestExport(){let c=bestCurrent();if(!c)return;exportX([['Article','Unité','Fournisseur','Prix TTC','Date','Facture','Quantité','Total TTC','Mois','Date référence','Fournisseurs ex æquo'],...c.data.map(x=>[x.a.name,x.a.unit,sn(c.supplier),x.p,x.r.date,x.r.num,x.r.qty,x.r.qty*x.p,c.m,c.day,x.w.map(r=>sn(r.supplier)).join(', ')])],'meilleurs-prix-fournisseur.xlsx','Meilleurs prix')}

function ocrPage(){let d=document.createElement('dialog');d.innerHTML='<h2>Scanner une facture</h2><p>La première utilisation nécessite Internet pour charger le moteur OCR. L’image est traitée sur cet appareil. Vérifiez toutes les valeurs.</p><input type="file" accept="image/*" capture="environment"><button data-run>Reconnaître le texte</button><p data-status></p><textarea placeholder="Texte reconnu ou saisi manuellement"></textarea><button data-parse>Préparer les lignes</button><div data-review></div><button data-close>Fermer</button>';document.body.append(d);d.showModal();d.onclose=()=>d.remove();d.querySelector('[data-close]').onclick=()=>d.close();let t=d.querySelector('textarea'),status=d.querySelector('[data-status]');d.querySelector('[data-run]').onclick=async()=>{let f=d.querySelector('input').files[0];if(!f)return alert('Choisissez une photo');let worker;try{status.textContent='Chargement du moteur OCR…';if(!window.Tesseract)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});worker=await Tesseract.createWorker('fra+eng',1,{logger:m=>{status.textContent=m.status+' '+Math.round((m.progress||0)*100)+' %'}});let r=await worker.recognize(f);t.value=r.data.text;status.textContent='Texte reconnu : vérifiez et préparez les lignes.'}catch(e){status.textContent='OCR indisponible. Vous pouvez saisir ou coller le texte manuellement.'}finally{if(worker)await worker.terminate()}};d.querySelector('[data-parse]').onclick=()=>ocrReview(d,t.value)}
function ocrReview(d,text){let norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),lines=text.split(/\n/),supplier=db.suppliers.find(s=>norm(text).includes(norm(s.name))),date=text.match(/\b(\d{2})[\/.-](\d{2})[\/.-](\d{4})\b/),num=text.match(/(?:facture|invoice)\s*(?:n[°o.]?\s*)?[:#-]?\s*([A-Z0-9][A-Z0-9/-]*\d[A-Z0-9/-]*)/i);let r=d.querySelector('[data-review]');r.innerHTML='<h3>Vérification</h3><label>Fournisseur<select data-s><option value="">Conserver la sélection actuelle</option>'+opts(db.suppliers,supplier?.id)+'</select></label><label>Date<input data-d type="date" value="'+(date?date[3]+'-'+date[2]+'-'+date[1]:'')+'"></label><label>Numéro<input data-n value="'+esc(num?.[1]||'')+'"></label><p>Seules les lignes reconnues avec un article existant sont proposées. Corrigez quantité et prix TTC. Les autres lignes restent à saisir manuellement.</p><div data-lines></div><button data-add>Ajouter les lignes vérifiées</button>';let box=r.querySelector('[data-lines]');for(let line of lines){let a=[...db.articles].sort((a,b)=>b.name.length-a.name.length).find(a=>norm(line).includes(norm(a.name)));if(!a)continue;let tail=norm(line).split(norm(a.name)).pop(),nums=tail.match(/\d+(?:[,.]\d+)?/g)||[];let row=document.createElement('div');row.className='panel';row.innerHTML='<small>'+esc(line)+'</small><label>Article<select>'+opts(db.articles,a.id)+'</select></label><label>Quantité<input type="number" step="any" value="'+(nums[0]||'').replace(',','.')+'"></label><label>Prix unitaire TTC<input type="number" step="any" value="'+(nums[1]||'').replace(',','.')+'"></label><label><input type="checkbox" style="width:auto"> Ligne vérifiée</label>';box.append(row)}r.querySelector('[data-add]').onclick=()=>{let additions=[];for(let row of box.children){let [q,p,c]=row.querySelectorAll('input');if(!c.checked)continue;let a=db.articles.find(a=>String(a.id)===row.querySelector('select').value);if(!a||!q.value||!p.value||!(+q.value>0)||!(+p.value>=0))return alert('Vérifiez les valeurs');additions.push({article:a.id,qty:+q.value,ht:+p.value,tax:0,pack:1})}if(r.querySelector('[data-s]').value)$('supplier').value=r.querySelector('[data-s]').value;if(r.querySelector('[data-d]').value)$('date').value=r.querySelector('[data-d]').value;if(r.querySelector('[data-n]').value)$('num').value=r.querySelector('[data-n]').value;draft.push(...additions);renderLines();d.close()}}

function orders(){return db.orders||[]}
function validMonths(v){return Number.isSafeInteger(Number(v))&&Number(v)>=1&&Number(v)<=1200}
function orderBest(article,date,months=3){if(!article||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!validMonths(months))return [];let [y,m,d]=date.split('-').map(Number),start=new Date(Date.UTC(y,m-1-Number(months),1));start.setUTCDate(Math.min(d,new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate()));let from=start.toISOString().slice(0,10);let candidates=rows().filter(r=>String(r.article)===String(article)&&sameUnit(r)&&r.date>=from&&r.date<=date&&Number.isFinite(ttc(r))&&ttc(r)>=0).sort((a,b)=>ttc(a)-ttc(b)||b.date.localeCompare(a.date)||String(a.supplier).localeCompare(String(b.supplier)));let best=candidates[0];if(!best)return [];let unique=new Map();for(let r of candidates){if(Math.abs(ttc(r)-ttc(best))>1e-9)break;if(!unique.has(r.supplier))unique.set(r.supplier,r)}return [...unique.values()]}
function preferredMonths(){return validMonths(db.orderMonths)?Number(db.orderMonths):3}
function orderPeriodChanged(){let v=$('omonths').value;if(!validMonths(v)){ $('ohint').textContent='Saisissez un nombre entier de 1 à 1200 mois.';return }let old=db.orderMonths;db.orderMonths=Number(v);if(!save())db.orderMonths=old;orderSuggest()}
function orderChoices(rows,selected){$('owinners').innerHTML=rows.length?'<p><b>Fournisseurs au meilleur prix</b></p>'+rows.map((r,i)=>`<label style="display:flex;align-items:center;gap:8px"><input style="width:auto;margin:4px" type="radio" name="owinner" ${String(r.supplier)===String(selected)?'checked':''} onchange="orderPick(${i})">${esc(sn(r.supplier))} · ${money(ttc(r))} · ${esc(r.date)}</label>`).join(''):''}
let ow=[];
function orderPick(i){let r=ow[i];if(!r)return;oref={supplier:r.supplier,date:r.date,price:ttc(r)};$('osupplier').value=r.supplier;$('oprice').value=ttc(r);orderLineTotal()}

let od=[],oe=null,ol=-1,oref=null;
function orderNum(){let p='CMD'+new Date().getFullYear(),n=0;for(let o of orders())if(o.num.startsWith(p)&&/^\d+$/.test(o.num.slice(p.length)))n=Math.max(n,+o.num.slice(p.length));return p+String(n+1).padStart(4,'0')}
function orderPage(id,duplicate=false){let o=orders().find(x=>x.id===id);oe=duplicate?null:o||null;od=structuredClone(o?.lines||[]);ol=-1;oref=null;ow=[];show('Nouvelle commande',`<label>Numéro<input id="onum" value="${esc(oe?.num||orderNum())}"></label><label>Date<input id="odate" type="date" value="${esc(oe?.date||new Date().toISOString().slice(0,10))}" onchange="orderSuggest()"></label>${monthControl("omonths",o?.months||preferredMonths(),"orderPeriodChanged")}<label>Article<select id="oarticle" onchange="orderSuggest()"><option value="">Sélectionner</option>${opts(db.articles)}</select></label><button onclick="scanCode('oarticle')">Scanner le code-barres</button><label>Fournisseur<select id="osupplier"><option value="">À déterminer</option>${opts(db.suppliers)}</select></label><label>Quantité<input id="oqty" type="number" min="0" step="any" oninput="orderLineTotal()"></label><label>Prix unitaire TTC (DH)<input id="oprice" type="number" min="0" step="any" oninput="orderLineTotal()"></label><small id="ohint"></small><div id="owinners"></div><p id="oltotal"></p><button id="oadd" onclick="orderAdd()">Ajouter la ligne</button><button onclick="orderReset()">Annuler la ligne</button><div id="olines"></div><button onclick="orderSave()">Enregistrer la commande</button>`);orderRender()}
function orderSuggest(){let months=$('omonths').value;if(!validMonths(months))return;let selected=$('osupplier').value;ow=orderBest($('oarticle').value,$('odate').value,months);let r=ow.find(x=>String(x.supplier)===String(selected))||ow[0];oref=r?{supplier:r.supplier,date:r.date,price:ttc(r)}:null;$('oprice').value=r?ttc(r):'';$('osupplier').value=r?r.supplier:'';$('ohint').textContent=r?'Meilleur prix historique sur '+months+' mois : '+money(ttc(r)):$('oarticle').value?'Aucun achat dans les '+months+' derniers mois. Saisie manuelle.':'';orderChoices(ow,r?.supplier);orderLineTotal()}
function orderLineTotal(){$('oltotal').textContent='Total ligne : '+money((+$('oqty').value||0)*(+$('oprice').value||0))}
function orderReset(){ol=-1;oref=null;ow=[];$('owinners').innerHTML='';for(let k of ['oarticle','osupplier','oqty','oprice'])$(k).value='';$('ohint').textContent='';$('oltotal').textContent='';$('oadd').textContent='Ajouter la ligne'}
function orderAdd(){if(!validMonths($('omonths').value))return alert('Période invalide.');let article=$('oarticle').value,supplier=$('osupplier').value,qty=+$('oqty').value,price=+$('oprice').value;if(!article||!$('oprice').value||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<0)return alert('Vérifiez article, quantité et prix.');let l={article,supplier,qty,price,unit:ol>=0&&od[ol].article===article?lineUnit(od[ol]):currentUnit(article),reference:oref};if(ol<0)od.push(l);else od[ol]=l;orderReset();orderRender()}
function orderEditLine(i){let l=od[i];ol=i;oref=l.reference||null;$('oarticle').value=l.article;$('osupplier').value=l.supplier;$('oqty').value=l.qty;$('oprice').value=l.price;$('ohint').textContent=oref?'Référence : '+money(oref.price)+' · '+sn(oref.supplier)+' · '+oref.date:'';ow=orderBest(l.article,$('odate').value,$('omonths').value);orderChoices(ow,l.supplier);$('oadd').textContent='Valider la modification';orderLineTotal()}
function orderTotal(o){return o.lines.reduce((s,l)=>s+l.qty*l.price,0)}
function orderGroups(lines,editable=false){let g=new Map();lines.forEach((l,i)=>{let a=g.get(l.supplier)||[];a.push({l,i});g.set(l.supplier,a)});return [...g].map(([s,a])=>`<h3>${esc(s?sn(s):'Fournisseur à déterminer')}</h3>${a.map(({l,i})=>`<div class="entry"><div>${esc(an(l.article))}<br><small>${esc(quantityUnit(l))} × ${money(l.price)}</small></div><b>${money(l.qty*l.price)}</b>${editable?`<details><summary>⋮</summary><div class="action-menu"><button onclick="orderEditLine(${i})">Modifier</button><button onclick="orderRemoveLine(${i})">Supprimer</button></div></details>`:''}</div>`).join('')}<p>Sous-total : <b>${money(a.reduce((v,x)=>v+x.l.qty*x.l.price,0))}</b></p>`).join('')+`<h3>Total TTC : ${money(orderTotal({lines}))}</h3>`}
function orderRemoveLine(i){if(confirm('Supprimer cette ligne ?')){od.splice(i,1);orderReset();orderRender()}}
function orderRender(){$('olines').innerHTML=orderGroups(od,true)}
function orderSave(){if(!validMonths($('omonths').value))return alert('Période invalide.');let num=$('onum').value.trim(),date=$('odate').value;if(!num||!date||!od.length)return alert('Numéro, date et lignes obligatoires.');if($('oarticle').value)return alert('Ajoutez ou annulez la ligne en cours.');if(orders().some(o=>o.id!==oe?.id&&o.num===num))return alert('Numéro déjà utilisé.');let old=db.orders;let o={id:oe?.id||uid(),num,date,months:Number($('omonths').value),lines:structuredClone(od)};db.orders=orders().filter(x=>x.id!==o.id).concat(o);if(save())orderHistory();else db.orders=old}
function orderHistory(){show('Historique des commandes','<input id="osearch" placeholder="Rechercher une commande" oninput="orderHistoryRender()"><button onclick="orderPage()">Nouvelle commande</button> <button onclick="orderExport()">Exporter Excel</button><div id="ohistory"></div>');orderHistoryRender()}
function orderHistoryRender(){let q=$('osearch').value.toLowerCase();$('ohistory').innerHTML=orders().slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(o=>[o.num,o.date,...o.lines.map(l=>sn(l.supplier)+' '+an(l.article))].join(' ').toLowerCase().includes(q)).map(o=>`<div class="panel history-entry"><div><b>${esc(o.num)}</b><p>${esc(o.date)} · ${money(orderTotal(o))}</p></div><details><summary>⋮</summary><div class="action-menu"><button onclick="orderView('${o.id}')">Consulter</button><button onclick="orderPage('${o.id}')">Modifier</button><button onclick="orderPage('${o.id}',true)">Dupliquer</button><button onclick="orderPrint('${o.id}')">Imprimer</button><button onclick="orderDelete('${o.id}')">Supprimer</button></div></details></div>`).join('')||'Aucune commande'}
function orderView(id){let o=orders().find(x=>x.id===id);show('Commande '+esc(o.num),`<div class="view-top no-print"><button onclick="orderHistory()">✕ Fermer</button></div><p>${esc(o.date)} · Période : ${esc(o.months||3)} mois</p><div id="orderPrintArea">${orderGroups(o.lines)}</div><button onclick="orderPrint('${id}')">Imprimer</button> <button onclick="orderHistory()">Historique</button>`)}
function orderPrint(id){orderView(id);window.print()}
function orderDelete(id){if(!confirm('Supprimer cette commande ?'))return;let old=db.orders;db.orders=orders().filter(o=>o.id!==id);if(save())orderHistory();else db.orders=old}
function orderExport(){exportX([['Commande','Date','Fournisseur','Article','Quantité','Prix TTC','Total TTC'],...orders().flatMap(o=>o.lines.map(l=>[o.num,o.date,l.supplier?sn(l.supplier):'',an(l.article),l.qty,l.price,l.qty*l.price]))],'commandes.xlsx','Commandes')}

function monthControl(id,value,callback){return `<label for="${id}">Période de recherche (mois)</label><div class="month-step"><button type="button" aria-label="Diminuer le nombre de mois" onclick="stepMonths('${id}',-1,${callback})">−</button><input id="${id}" type="number" min="1" max="1200" step="1" value="${esc(value)}" onchange="${callback}()"><button type="button" aria-label="Augmenter le nombre de mois" onclick="stepMonths('${id}',1,${callback})">+</button></div>`}
function stepMonths(id,delta,callback){let el=$(id);el.value=Math.max(1,Math.min(1200,(validMonths(el.value)?Number(el.value):preferredMonths())+delta));callback()}
function invoiceView(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;show('Facture '+esc(i.num),`<div class="view-top no-print"><button onclick="historyPage()">✕ Fermer</button></div><p>${esc(i.date)} · ${esc(sn(i.supplier))}</p><div class="scroll"><table><thead><tr><th>Article</th><th>Qté</th><th>P.U. TTC</th><th>Total TTC</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(an(l.article))}</td><td>${esc(quantityUnit(l))}</td><td>${money(ttc(l))}</td><td>${money(l.qty*ttc(l))}</td></tr>`).join('')}</tbody></table></div><h3>Total TTC : ${money(total(i))}</h3>${i.photo?`<button onclick="viewPhoto('${id}')">Photo</button>`:''}<button onclick="invoicePrint('${id}')">Imprimer</button> <button onclick="historyPage()">Historique</button>`)}
function invoicePrint(id){invoiceView(id);window.print()}
function invoiceDuplicate(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;invoice();draft=structuredClone(i.lines);$('supplier').value=i.supplier;renderLines()}
function articleView(id){let a=db.articles.find(x=>x.id===id);if(!a)return;show('Fiche article',`<div class="view-top no-print"><button onclick="articles()">✕ Fermer</button></div><h3>${esc(a.name)}</h3><p>Catégorie : ${esc(a.cat||'—')}<br>Unité : ${esc(a.unit||'—')}<br>Code-barres : ${esc(a.barcode||'—')}</p><h3>Derniers prix par fournisseur</h3>${comparisonData(id).map(r=>`<p>${esc(sn(r.supplier))} · ${money(r.p)} / ${esc(a.unit)} · ${esc(quantityUnit(r))} · ${esc(r.date)}</p>`).join('')||'Aucun achat'}<p><button onclick="articlePrint('${id}')">Imprimer</button> <button onclick="articles()">Articles</button></p>`)}
function articlePrint(id){articleView(id);window.print()}
function articleDuplicate(id){let a=db.articles.find(x=>x.id===id);if(!a)return;articles();$('name').value=a.name+' (copie)';$('cat').value=a.cat||'';$('unit').value=a.unit||'';$('barcode').value='';$('name').focus()}
function articleBestPage(){show('Meilleur prix par article',monthControl('abmonths',preferredMonths(),'articleBestPeriod')+`<div class="no-print"><label for="absearch">Article</label><div class="abcombo"><div class="abcombo-row"><input id="absearch" autocomplete="off" placeholder="Tous les articles" role="combobox" aria-expanded="false" aria-controls="aboptions" oninput="abOpen(true);articleBestRender()" onfocus="abOpen(true)" onkeydown="abKey(event)"><button type="button" aria-label="Afficher les articles" onclick="abOpen($('aboptions').hidden,true)">▼</button></div><div id="aboptions" role="listbox" hidden></div></div><label>Catégorie<select id="abcat" onchange="abOpen(false);articleBestRender()"><option value="">Toutes les catégories</option>${values('cat').map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></label></div><button onclick="window.print()">Imprimer</button> <button onclick="articleBestExport()">Exporter Excel</button> <button onclick="articleBestConsult()">Consulter</button><div id="abresult"></div>`);articleBestRender()}
function articleBestPeriod(){let v=$('abmonths').value;if(!validMonths(v)){articleBestRender();return}let old=db.orderMonths;db.orderMonths=Number(v);if(!save())db.orderMonths=old;articleBestRender()}
function articleBestData(months,date,search='',cat=''){return [...db.articles].filter(a=>(!cat||a.cat===cat)&&String(a.name).toLocaleLowerCase('fr').includes(search.toLocaleLowerCase('fr'))).sort((a,b)=>a.name.localeCompare(b.name,'fr',{sensitivity:'base'})).map(a=>({a,w:orderBest(a.id,date,months)}))}
function articleBestCurrent(){let m=$('abmonths').value;if(!validMonths(m))return null;let date=new Date();let day=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');return {m,day,data:articleBestData(m,day,$('absearch').value,$('abcat').value)}}
function articleBestRender(){let c=articleBestCurrent();if(!c){$('abresult').textContent='Saisissez un nombre entier de 1 à 1200 mois.';return}let yes=c.data.filter(x=>x.w.length),no=c.data.filter(x=>!x.w.length);$('abresult').innerHTML=`<p>Prix historiques TTC sur ${esc(c.m)} mois au ${esc(c.day)}. ${yes.length} article(s) avec achat.</p>`+yes.map(({a,w})=>`<div class="report-item"><b>${esc(a.name)}</b> · ${money(ttc(w[0]))} / ${esc(a.unit)}${w.map(r=>`<p>${esc(sn(r.supplier))} · ${esc(r.date)}</p>`).join('')}</div>`).join('')+`<h3>Sans achat sur la période (${no.length})</h3>`+no.map(({a})=>`<p>${esc(a.name)}</p>`).join('')}
function articleBestExport(){let c=articleBestCurrent();if(!c)return alert('Période invalide.');exportX([['Article','Catégorie','Unité','Meilleur prix TTC','Fournisseur','Date achat','Période (mois)','Date de référence'],...c.data.flatMap(({a,w})=>w.length?w.map(r=>[a.name,a.cat,a.unit,ttc(r),sn(r.supplier),r.date,c.m,c.day]):[[a.name,a.cat,a.unit,'','Aucun achat','',c.m,c.day]])],'meilleurs-prix-articles.xlsx','Meilleurs prix')}

function localDay(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function currentUnit(id){return db.articles.find(a=>String(a.id)===String(id))?.unit||""}function lineUnit(l){return l.unit||currentUnit(l.article)}function sameUnit(l){return lineUnit(l)===currentUnit(l.article)}function quantityUnit(l){return Number(l.qty).toLocaleString('fr-FR',{maximumFractionDigits:12})+' '+(l.unit||db.articles.find(a=>String(a.id)===String(l.article))?.unit||'')}
function periodRows(article,date,months){if(!validMonths(months))return [];let [y,m,d]=date.split('-').map(Number),start=new Date(Date.UTC(y,m-1-Number(months),1));start.setUTCDate(Math.min(d,new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate()));let from=start.toISOString().slice(0,10);return rows().filter(r=>String(r.article)===String(article)&&sameUnit(r)&&r.date>=from&&r.date<=date&&Number.isFinite(ttc(r))&&ttc(r)>=0)}
function purchaseDetails(rr){return rr.map(r=>`<div class="report-item"><b>${esc(sn(r.supplier))}</b><p>${esc(r.date)} · Facture ${esc(r.num)}</p><p>${esc(quantityUnit(r))} × ${money(ttc(r))} = ${money(r.qty*ttc(r))}</p></div>`).join('')||'Aucun achat'}
function articleBestConsult(){let c=articleBestCurrent();if(!c)return alert('Période invalide.');let body=c.data.flatMap(({a,w})=>w.length?w.map(r=>[a.name,a.unit,money(ttc(r)),sn(r.supplier),r.date]):[[a.name,a.unit,'—','Aucun achat','—']]);pricePreview('État des meilleurs prix par article',c.m,c.day,body,articleBestExport,'Article : '+($('absearch').value||'Tous')+' · Catégorie : '+($('abcat').value||'Toutes'))}
home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function abOpen(open,all=false){let box=$('aboptions'),input=$('absearch');if(!box)return;box.hidden=!open;input.setAttribute('aria-expanded',String(open));if(!open)return;let q=all?'':input.value.toLocaleLowerCase('fr');box.replaceChildren();let names=['',...[...new Set(db.articles.map(a=>a.name))].sort((a,b)=>a.localeCompare(b,'fr'))];for(let name of names.filter(n=>!n||n.toLocaleLowerCase('fr').includes(q))){let b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.textContent=name||'Tous les articles';b.onclick=()=>{input.value=name;abOpen(false);articleBestRender()};box.append(b)}}
function abKey(e){if(e.key==='Escape')abOpen(false);if(e.key==='ArrowDown'){e.preventDefault();abOpen(true);$('aboptions').querySelector('button')?.focus()}}
document.addEventListener('click',e=>{if($('aboptions')&&!e.target.closest('.abcombo'))abOpen(false)});
function pricePreview(title,m,day,body,exporter,filter){let d=document.createElement('dialog');d.className='price-preview';d.innerHTML=`<div class="preview-top no-print"><strong>${esc(title)}</strong><button aria-label="Fermer" data-close>✕</button></div><div class="preview-paper"><h2>${esc(title)}</h2><p>${esc(filter)}</p><p>Période : ${esc(m)} mois · Date de référence : ${esc(day)}</p><div class="scroll"><table><thead><tr>${['Article','Unité','Prix TTC','Fournisseur','Date achat'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>Nombre de lignes : ${body.length}</p></div><div class="no-print"><button data-back>Retour</button> <button data-print>Imprimer</button> <button data-export>Exporter Excel</button></div>`;document.body.append(d);d.onclose=()=>{d.remove();document.body.classList.remove('preview-print')};d.querySelector('[data-back]').onclick=()=>d.close();d.querySelector('[data-close]').onclick=()=>d.close();d.querySelector('[data-print]').onclick=()=>{document.body.classList.add('preview-print');try{window.print()}finally{document.body.classList.remove('preview-print')}};d.querySelector('[data-export]').onclick=exporter;d.showModal()}
</script></html>

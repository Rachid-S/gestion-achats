const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number(x).toFixed(2)+' DH', uid=()=>crypto.randomUUID();let db=JSON.parse(localStorage.getItem('achats-v1')||'{"articles":[],"suppliers":[],"invoices":[]}'),draft=[],edit=null,photo='';function save(){try{localStorage.setItem('achats-v1',JSON.stringify(db));return true}catch(e){alert('Stockage plein : exportez une sauvegarde.');return false}}function show(t,h){$('app').innerHTML='<button onclick="home()">← Accueil</button><section><h2>'+t+'</h2>'+h+'</section>'}function home(){let m=new Date().toISOString().slice(0,7);$('app').innerHTML='<section><small>Achats du mois TTC</small><h2>'+money(db.invoices.filter(i=>i.date.startsWith(m)).reduce((s,i)=>s+total(i),0))+'</h2>'+db.invoices.length+' factures</section><div class="grid">'+[['Nouvelle facture','invoice()'],['Nouvel article','articles()'],['Fournisseurs','suppliers()'],['Comparaison des prix','compare()'],['Historique des achats','historyPage()'],['Évolution des prix','trend()'],['Importation Excel','imports()'],['Exportation Excel','exportX()'],['Sauvegarde / restauration','backup()']].map(([a,b])=>`<button onclick="${b}">${a}</button>`).join('')+'</div>'}function total(i){return i.lines.reduce((s,l)=>s+l.qty*l.ht*(1+l.tax/100),0)}function opts(a,v){return a.map(x=>`<option value="${esc(x.id)}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('')}function articles(){show('Articles','<label>Désignation<input id="name"></label><label>Catégorie<input id="cat"></label><label>Unité de base<select id="unit"><option>kg</option><option>L</option><option>pièce</option></select></label><label>Nombre d’unités de base par emballage<input id="pack" type="number" min="0.001" step="any" value="1"></label><button onclick="addArticle()">Enregistrer</button><hr>'+db.articles.map(a=>`<p>${esc(a.name)} — ${a.pack} ${esc(a.unit)} / emballage · ${esc(a.cat)}</p>`).join(''))}function addArticle(){let name=$('name').value.trim(),pack=+$('pack').value;if(!name||!(pack>0))return alert('Données invalides');db.articles.push({id:uid(),name,cat:$('cat').value,unit:$('unit').value,pack});save();articles()}function suppliers(){show('Fournisseurs','<label>Nom<input id="name"></label><label>Téléphone<input id="tel" type="tel"></label><button onclick="addSupplier()">Enregistrer</button><hr>'+db.suppliers.map(s=>`<p>${esc(s.name)} · ${esc(s.tel)}</p>`).join(''))}function addSupplier(){let name=$('name').value.trim();if(!name)return;db.suppliers.push({id:uid(),name,tel:$('tel').value});save();suppliers()}function invoice(id){if(!db.articles.length||!db.suppliers.length)return alert('Créez d’abord un article et un fournisseur.');edit=id?db.invoices.find(i=>i.id===id):null;draft=edit?structuredClone(edit.lines):[];photo=edit?.photo||'';show('Facture',`<label>Numéro<input id="num" value="${esc(edit?.num||'')}"></label><label>Date<input id="date" type="date" value="${edit?.date||new Date().toISOString().slice(0,10)}"></label><label>Fournisseur<select id="supplier">${opts(db.suppliers,edit?.supplier)}</select></label><hr><label>Article<select id="article">${opts(db.articles)}</select></label><label>Quantité (emballages)<input id="qty" type="number" step="any" value="1"></label><label>Prix unitaire HT (DH)<input id="ht" type="number" step="any"></label><label>TVA (%)<input id="tax" type="number" step="any" value="0"></label><button onclick="addLine()">Ajouter la ligne</button><div id="lines"></div><label>Photo facultative<input type="file" accept="image/*" onchange="attach(this.files[0])"></label><small id="photoStatus">${photo?'Photo jointe':''}</small><p><button onclick="storeInvoice()">Enregistrer la facture</button></p>`);renderLines()}function attach(f){if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;$('photoStatus').textContent='Photo jointe'};if(f.size>1500000)return alert('Photo trop grande (max. 1,5 Mo).');r.readAsDataURL(f)}function addLine(){let qty=+$('qty').value,ht=+$('ht').value,tax=+$('tax').value;if(!$('ht').value||qty<=0||ht<0||tax<0)return alert('Vérifiez les valeurs');let a=db.articles.find(a=>a.id===$('article').value);draft.push({article:a.id,qty,ht,tax,pack:a.pack});renderLines()}function renderLines(){$('lines').innerHTML='<div class="scroll"><table>'+draft.map((l,i)=>`<tr><td>${esc(an(l.article))}</td><td>${l.qty}</td><td>${money(l.ht)}</td><td><button onclick="draft.splice(${i},1);renderLines()">×</button></td></tr>`).join('')+'</table></div><p>Total TTC : <b>'+money(total({lines:draft}))+'</b></p>'}function storeInvoice(){let num=$('num').value.trim(),date=$('date').value,supplier=$('supplier').value;if(!num||!date||!draft.length)return alert('Numéro, date et lignes obligatoires');if(db.invoices.some(i=>i.id!==edit?.id&&i.num===num&&i.supplier===supplier))return alert('Facture déjà présente');let i={id:edit?.id||uid(),num,date,supplier,lines:draft,photo};let old=db.invoices;db.invoices=old.filter(x=>x.id!==i.id).concat(i);if(save())home();else db.invoices=old}function an(id){return db.articles.find(a=>a.id===id)?.name||'?'}function sn(id){return db.suppliers.find(a=>a.id===id)?.name||'?'}function historyPage(){show('Historique',db.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="panel"><b>${esc(i.num)} · ${esc(sn(i.supplier))}</b><p>${i.date} · ${money(total(i))}</p><button onclick="invoice('${i.id}')">Modifier</button> <button onclick="removeInvoice('${i.id}')">Supprimer</button>${i.photo?` <button onclick="viewPhoto('${i.id}')">Photo</button>`:''}</div>`).join('')||'Aucune facture')}function viewPhoto(id){show('Photo','<img src="'+esc(db.invoices.find(i=>i.id===id).photo)+'">')}function removeInvoice(id){if(confirm('Supprimer cette facture ?')){db.invoices=db.invoices.filter(i=>i.id!==id);save();historyPage()}}function rows(){return db.invoices.flatMap(i=>i.lines.map(l=>({...l,date:i.date,supplier:i.supplier,num:i.num}))).sort((a,b)=> function download(data,name,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){show('Sauvegarde','<button onclick="download(JSON.stringify(db),\'achats.json\',\'application/json\')">Exporter la sauvegarde complète</button><p>Inclut les photos.</p><label>Restaurer (remplace les données)<input type="file" accept=".json" onchange="restore(this.files[0])"></label>')}async function restore(f){try{let d=JSON.parse(await f.text());if(!['articles','suppliers','invoices'].every(k=>Array.isArray(d[k])))throw Error();if(confirm('Remplacer toutes les données ?')){let old=db;db=d;if(save())home();else db=old}}catch(e){alert('Sauvegarde invalide')}}const headers=['Date','Facture','Fournisseur','Article','Catégorie','Unité','Conditionnement','Quantité','Prix HT','TVA'];function dataRows(){return [headers,...rows().map(r=>{let a=db.articles.find(a=>a.id===r.article);return [r.date,r.num,sn(r.supplier),a.name,a.cat,a.unit,r.pack,r.qty,r.ht,r.tax]})]}const enc=new TextEncoder(),dec=new TextDecoder();function zip(files){let parts=[],central=[],offset=0;for(let [name,str] of Object.entries(files)){let n=enc.encode(name),d=enc.encode(str),crc=~0;for(let b of d){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=~crc;let h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,n.length,true);h.set(n,30);let c=new Uint8Array(46+n.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint32(16,crc,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);c.set(n,46);parts.push(h,d);central.push(c);offset+=h.length+d.length}let end=new Uint8Array(22),v=new DataView(end. '),v=c.getElementsByTagName('v')[0]?.textContent||'';a[j-1]=t==='s'?ss[+v]:t==='inlineStr'?c.getElementsByTagName('is')[0]?.textContent:v}return a})}let norm=s=>String(s??'').trim().toLowerCase().replace(/^\ufeff/,'');let idx=headers.map(h=>r[0].findIndex(x=>norm(x)===norm(h)));if(idx.some(i=>i<0))throw Error('Colonnes manquantes : '+headers.filter((h,i)=>idx[i]<0).join(', '));let d=structuredClone(db),groups=new Map(),bad=0,skip=0;for(let row of r.slice(1)){if(!row.some(Boolean))continue;let [date,num,supplier,name,cat,unit,pack,qty,ht,tax]=idx.map(i=>String(row[i]??'').trim());let number=x=>Number(x.replace(',','.'));if(/^\d{5}(\.\d+)?$/.test(date))date=new Date((+date-25569)*86400000).toISOString().slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!num||!supplier||!name||!unit||!ht||!(number(pack)>0)||!(number(qty)>0)||!(number(ht)>=0)||!(number(tax)>=0)){bad++;continue}let s=d.suppliers.find(x=>norm(x.name)===norm(supplier));if(!s){s={id:uid(),name:supplier,tel:''};d.suppliers.push(s)}let key=s.id+'|'+num;if(db.invoices.some(i=>i.supplier===s.id&&i.num===num)){skip++;continue}let a=d.articles.find(x=>norm(x.name)===norm(name)&&x.unit===unit);if(!a){a={id:uid(),name,cat,unit,pack:number(pack)};d.articles.push(a)}let i=groups.get(key);if(!i){i={id:uid(),num,date,supplier:s.id,lines:[],photo:''};groups.set(key,i)}if(i.date!==date){bad++;continue}i.lines.push({article:a.id,qty:number(qty),ht:number(ht),tax:number(tax),pack:number(pack)})}d.invoices.push(...groups.values());pending=d;$('preview').innerHTML=`<p>${groups.size} nouvelles factures · ${bad} lignes invalides · ${skip} lignes de factures existantes ignorées.</p><button onclick="commitImport()">Confirmer l’importation</button>`}catch(e){$('preview').textContent=e.message}}function commitImport(){if(!pending)return;download(JSON.stringify(db),'avant-import.json','application/json');let old=db;db=pending;if(save()){pending=null;home()}else db=old}home();if('serviceWorker'in navigator)navigator.serviceWorker.re
